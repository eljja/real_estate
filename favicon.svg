<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="1.5" />

  <!-- High-rise Building 1 (Center-Left) -->
  <rect x="12" y="24" width="16" height="30" rx="2" fill="url(#bldGrad)" opacity="0.9" />
  <!-- Windows -->
  <rect x="15" y="28" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="21" y="28" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="15" y="34" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="21" y="34" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="15" y="40" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="21" y="40" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="15" y="46" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />
  <rect x="21" y="46" width="3" height="3" rx="0.5" fill="#e0f2fe" opacity="0.9" />

  <!-- High-rise Building 2 (Center-Right, Taller) -->
  <rect x="26" y="14" width="18" height="40" rx="2" fill="url(#bldGrad)" />
  <!-- Windows -->
  <rect x="30" y="18" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="36.5" y="18" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="30" y="24" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="36.5" y="24" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="30" y="30" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="36.5" y="30" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="30" y="36" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="36.5" y="36" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="30" y="42" width="3.5" height="3" rx="0.5" fill="#ffffff" />
  <rect x="36.5" y="42" width="3.5" height="3" rx="0.5" fill="#ffffff" />

  <!-- Building 3 (Right, Smaller) -->
  <rect x="42" y="30" width="10" height="24" rx="2" fill="url(#bldGrad)" opacity="0.75" />
  <rect x="45" y="34" width="2.5" height="2.5" rx="0.5" fill="#e0f2fe" opacity="0.8" />
  <rect x="45" y="40" width="2.5" height="2.5" rx="0.5" fill="#e0f2fe" opacity="0.8" />
  <rect x="45" y="46" width="2.5" height="2.5" rx="0.5" fill="#e0f2fe" opacity="0.8" />

  <!-- Dynamic Financial Trend Line (Up/Down Pulse Wave) -->
  <path d="M6 46 L20 38 L34 22 L46 30 L58 16" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Apex Pulse Dot -->
  <circle cx="58" cy="16" r="3.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
</svg>